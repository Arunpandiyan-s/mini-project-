[project]
name = "stayease-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BILLA", email = "adithyen1@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "bcrypt>=4.1.0",
    "pyjwt>=2.8.0",
    "email-validator>=2.1.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.13",
    "asyncpg>=0.32.0",
]

[project.scripts]
stayease-backend = "stayease_backend:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
